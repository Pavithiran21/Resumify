name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # A one-node replica set, as on Atlas: matches are saved in a transaction.
      - name: Start MongoDB 8
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'rs.status().myState' | grep -q 1 && break; sleep 2; done

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Lint and build the frontend
        run: |
          npm run lint --prefix frontend
          npm run build --prefix frontend

      - name: The backend imports cleanly
        working-directory: backend
        run: python -m compileall -q app scripts

      # CI's own backend/.env. scripts.make_env (run by e2e/prepare.js) writes .env.test on top of it
      # with resumify_test, a new JWT secret, the model on the local stub (e2e/mocks) and two new
      # Ethereal inboxes. Nothing here is a real secret, and no model API is ever called.
      - name: Write backend/.env
        run: |
          cat > backend/.env <<EOF
          APP_ENV=development
          PORT=4000
          MONGODB_URI=mongodb://127.0.0.1:27017/resumify?replicaSet=rs0
          JWT_SECRET=$(openssl rand -base64 48)
          FRONTEND_URL=http://localhost:5173
          SMTP_HOST=smtp.ethereal.email
          SMTP_PORT=587
          SMTP_USER=replaced-by-make-env
          SMTP_PASS=replaced-by-make-env
          SMTP_FROM=Resumify <no-reply@resumify.test>
          LLM_BASE_URL=http://localhost:8080/llm/v1
          EOF

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Playwright (API + browser)
        working-directory: e2e
        env:
          CI: 'true'
          PYTHON: python
        run: npm test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker image starts and serves the app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Start MongoDB 8
        run: |
          docker run -d --name mongo --network host mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
      - name: Build
        run: docker build -t resumify .
      - name: Run and check the page and the API
        run: |
          docker run -d --name app --network host \
            -e PORT=4000 -e MONGODB_URI='mongodb://127.0.0.1:27017/resumify_demo?replicaSet=rs0' \
            -e JWT_SECRET=$(openssl rand -hex 32) -e FRONTEND_URL=http://127.0.0.1:4000 \
            -e LLM_BASE_URL=http://127.0.0.1:8080/llm/v1 -e SMTP_HOST=smtp.ethereal.email -e SMTP_USER=none \
            -e SMTP_PASS=none -e SMTP_FROM=no-reply@resumify.test -e DEMO_MODE=true -e DEMO_PASSWORD=ci-demo-password-1 resumify
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:4000/api/health
          curl -fs http://127.0.0.1:4000/matches | grep -q '<div id="root">'
          curl -fs http://127.0.0.1:4000/api/demo | grep -q 'demo.resumify.test'
          # the demo list never carries the password: "Log in as" needs none
          ! curl -fs http://127.0.0.1:4000/api/demo | grep -q 'ci-demo-password-1'
          # password-free demo log-in exists (no demo accounts are seeded here, so it says so)
          curl -s -X POST -H 'Content-Type: application/json' -d '{"role":"User"}' http://127.0.0.1:4000/api/demo/login | grep -q 'not set up'
          curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"role":"Admin"}' http://127.0.0.1:4000/api/demo/login | grep -q '^400$'
      - name: Container log
        if: always()
        run: docker logs app || true
