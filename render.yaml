# Render Blueprint: one free web service for the API only (Dockerfile.api). The React app is hosted on
# Vercel (Root Directory: frontend); its vercel.json forwards /api/* to this service, so the browser sees
# one origin and the refresh cookie keeps working. Set FRONTEND_URL below to the Vercel URL.
# The database is MongoDB Atlas (free M0) with the database resumify_demo. Set the secrets below in
# the Render dashboard, then run once from the service's Shell:
#   python -m scripts.seed_demo
# Atlas: allow Render's outbound IPs (or 0.0.0.0/0) under Network Access.
# Free services sleep after 15 minutes without traffic; the first visit then takes about a minute.
services:
  - type: web
    name: resumify-pavithiran
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FORWARDED_ALLOW_IPS
        value: '*' # trust Vercel's and Render's proxies, so rate limits see the visitor's IP
      - key: LOG_LEVEL
        value: info
      - key: DEMO_MODE
        value: 'true'
      - key: RATE_LIMITS_ENABLED
        value: 'true'
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low # gpt-oss spends its answer tokens thinking otherwise, and the match reply is cut off
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # mongodb+srv://…/resumify_demo
      - key: FRONTEND_URL
        sync: false # the Vercel URL, https://<project>.vercel.app (CORS and the links in emails)
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEMO_SMTP_HOST
        sync: false
      - key: DEMO_SMTP_PORT
        sync: false
      - key: DEMO_SMTP_USER
        sync: false
      - key: DEMO_SMTP_PASS
        sync: false
