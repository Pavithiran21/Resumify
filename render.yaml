# Render Blueprint: one free web service from the Dockerfile (API + built frontend on one origin).
# The database is MongoDB Atlas (free M0) with the database resumify_demo. Set the secrets below in
# the Render dashboard, then run once from the service's Shell:
#   python -m scripts.seed_demo
# Atlas: allow Render's outbound IPs (or 0.0.0.0/0) under Network Access.
# Free services sleep after 15 minutes without traffic; the first visit then takes about a minute.
services:
  - type: web
    name: resumify
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FORWARDED_ALLOW_IPS
        value: '*' # trust Render's proxy, so rate limits see the visitor's IP
      - key: LOG_LEVEL
        value: info
      - key: DEMO_MODE
        value: 'true'
      - key: RATE_LIMITS_ENABLED
        value: 'true'
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # mongodb+srv://…/resumify_demo
      - key: FRONTEND_URL
        sync: false # https://<service>.onrender.com
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEMO_SMTP_HOST
        sync: false
      - key: DEMO_SMTP_PORT
        sync: false
      - key: DEMO_SMTP_USER
        sync: false
      - key: DEMO_SMTP_PASS
        sync: false
